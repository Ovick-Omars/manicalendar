<body class="bg-[#F4F7F6] text-slate-800 dark:bg-stone-950 dark:text-stone-100 min-h-screen flex flex-col transition-colors duration-300 pb-20">

  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- Interactive React Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const defaultGasUrl = 'https://script.google.com/macros/s/AKfycbzkk8fFHljs71hmUqMnS8rCf6T5GuJ5iO1PglcybaSSXk9cAP1YnJCEkbfC9YOT67fLCw/exec';
      const [apiConnected, setApiConnected] = useState(false);
      const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('gas_api_url') || defaultGasUrl);
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('active_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [currentTab, setCurrentTab] = useState('home'); 
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
      
      // Data States
      const [users, setUsers] = useState([]);
      const [todos, setTodos] = useState([]);
      const [infos, setInfos] = useState([]);
      const [syncing, setSyncing] = useState(false);
      
      // Pagination State for Todos
      const [currentPage, setCurrentPage] = useState(1);
      const rowsPerPage = 10;

      // Toast Notification States
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, message: '', action: null });
      const [isUrlModalOpen, setIsUrlModalOpen] = useState(false);
      const [customUrlInput, setCustomUrlInput] = useState('');

      // Password Toggle states
      const [showPassword, setShowPassword] = useState(false);
      const [showRegPassword, setShowRegPassword] = useState(false);

      // Authentication States
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [regForm, setRegForm] = useState({ username: '', email: '', password: '' });
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      // Task/Activity Modal Form State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedDate, setSelectedDate] = useState(null);
      const [activityForm, setActivityForm] = useState({
        id: '',
        task: '',
        subActivity: '',
        pic: '',
        startDate: '',
        endDate: '',
        progress: 0,
        keterangan: '',
        createdBy: ''
      });
      const [isEditing, setIsEditing] = useState(false);

      // Info Form Modal State
      const [isInfoModalOpen, setIsInfoModalOpen] = useState(false);
      const [isEditingInfo, setIsEditingInfo] = useState(false);
      const [infoForm, setInfoForm] = useState({
        id: '',
        title: '',
        content: ''
      });

      // Keterangan Modal State
      const [keteranganModal, setKeteranganModal] = useState({ isOpen: false, todo: null, text: '' });

      // Quran Component States & Advanced Qari Lists
      const [quranSurahs, setQuranSurahs] = useState([]);
      const [selectedSurah, setSelectedSurah] = useState(null);
      const [surahDetails, setSurahDetails] = useState(null);
      const [loadingQuran, setLoadingQuran] = useState(false);
      const [playingAudio, setPlayingAudio] = useState(null); 
      const [quranSearch, setQuranSearch] = useState('');
      const [isPlayingFullSurah, setIsPlayingFullSurah] = useState(false);
      const [currentFullSurahIndex, setCurrentFullSurahIndex] = useState(0);
      
      const [quranPlayMode, setQuranPlayMode] = useState('full'); // 'full' | 'range'
      const [startAyah, setStartAyah] = useState('');
      const [endAyah, setEndAyah] = useState('');
      const [isPlayingRange, setIsPlayingRange] = useState(false);
      const [selectedQari, setSelectedQari] = useState('ar.alafasy');

      // Audio status control via Refs for synchronous safe validation in loop callbacks
      const isPlayingFullSurahRef = useRef(false);
      const isPlayingRangeRef = useRef(false);

      const qariList = [
        { name: 'Misyari Al-Afasy', id: 'ar.alafasy' },
        { name: 'Abdurrahman As-Sudais', id: 'ar.abdurrahmaansudais' },
        { name: 'Maher Al-Muaiqly', id: 'ar.mahermuaiqly' },
        { name: 'Ali Al-Hudhaify', id: 'ar.hudhaify' },
        { name: 'Mahmoud Khalil Al-Husary', id: 'ar.husary' },
        { name: 'Saad Al-Ghamdi', id: 'ar.saadalgamdi' },
        { name: 'Abdul Basit Abdul Samad', id: 'ar.abdulbasitmurattal' },
        { name: 'Mohamed Siddiq El-Minshawi', id: 'ar.minshawi' }
      ];
      
      const audioRef = useRef(null);

      // Static Backup/Demo Data
      const fallbackTodos = [
        { id: '1', task: 'Ujian Tengah Semester Ganjil', subActivity: 'Persiapan lembar soal & pengawas madrasah', pic: 'admin', startDate: '2026-06-01', endDate: '2026-06-05', progress: 50, createdBy: 'admin', keterangan: 'Soal sedang dicetak.' },
        { id: '2', task: 'Rapat Kerja Tahunan Madrasah', subActivity: 'Penyusunan anggaran belanja sekolah', pic: 'rafliano', startDate: '2026-06-10', endDate: '2026-06-12', progress: 100, createdBy: 'admin', keterangan: 'Rapat berjalan lancar.' },
        { id: '3', task: 'Penerimaan Santri Baru (PSB)', subActivity: 'Seleksi berkas & wawancara online', pic: 'rafliano', startDate: '2026-06-15', endDate: '2026-06-20', progress: 20, createdBy: 'admin', keterangan: '' }
      ];

      const fallbackInfos = [
        { id: '1', title: 'Persiapan Ujian Semester', content: 'Diharapkan seluruh asatidzah mempersiapkan naskah soal ujian paling lambat akhir minggu ini.', timestamp: '2026-06-01T09:15:00.000Z', createdBy: 'rafliano' },
        { id: '2', title: 'Kebersihan Lingkungan Madrasah', content: 'Kerja bakti rutin hari Jumat akan difokuskan pada area halaman depan dan ruang kelas baru.', timestamp: '2026-06-01T10:30:00.000Z', createdBy: 'admin' }
      ];

      useEffect(() => {
        const rootClass = document.documentElement.classList;
        if (theme === 'dark') {
          rootClass.add('dark');
        } else {
          rootClass.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast(prev => ({ ...prev, show: false }));
        }, 4000);
      };

      const askConfirmation = (message, onConfirmAction) => {
        setConfirmModal({
          isOpen: true,
          message,
          action: () => {
            onConfirmAction();
            setConfirmModal({ isOpen: false, message: '', action: null });
          }
        });
      };

      // Safely parse date ensuring NO zone offset deduction (anti-back-one-day bug)
      const parseLocalDate = (dateStr) => {
        if (!dateStr) return null;
        try {
          const str = dateStr.toString().trim();
          // If ISO format (contains T), separate date parts manually to avoid time zone shift
          if (str.includes('T')) {
            const rawYmd = str.split('T')[0];
            const parts = rawYmd.split('-');
            if (parts.length === 3) {
              return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            }
          }
          const parts = str.split(/[-/]/);
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            }
            if (parts[2].length === 4) {
              return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
            }
          }
          const fallbackD = new Date(str);
          if (!isNaN(fallbackD.getTime())) return fallbackD;
        } catch (e) {
          console.error("Gagal melakukan parse tanggal lokal", e);
        }
        return null;
      };

      const formatDateStr = (dateStr) => {
        if (!dateStr) return '';
        const d = parseLocalDate(dateStr);
        if (!d) return dateStr;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
      };

      const formatToInputDate = (dateStr) => {
        if (!dateStr) return '';
        const d = parseLocalDate(dateStr);
        if (!d) return dateStr;
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      // Perfect formatting of ISO Date or local Timestamp in Infos to dd-mm-yyyy hh:mm
      const formatTimestamp = (ts) => {
        if (!ts) return '';
        try {
          const tsStr = ts.toString().trim();
          const d = new Date(tsStr);
          if (!isNaN(d.getTime())) {
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}-${month}-${year} ${hours}:${minutes}`;
          }
          return tsStr;
        } catch (e) {
          return ts;
        }
      };

      const syncWithCloud = async (urlToUse = apiUrl) => {
        if (!urlToUse || urlToUse === defaultGasUrl) {
          const localT = localStorage.getItem('local_todos');
          const localI = localStorage.getItem('local_infos');
          const localU = localStorage.getItem('local_users');
          setTodos(localT ? JSON.parse(localT) : fallbackTodos);
          setInfos(localI ? JSON.parse(localI) : fallbackInfos);
          if (localU) setUsers(JSON.parse(localU));
          setApiConnected(false);
          return;
        }

        setSyncing(true);
        try {
          const todosRes = await fetch(`${urlToUse}?action=getTodos`);
          const todosData = await todosRes.json();
          if (todosData.status === 'success') {
            setTodos(todosData.data);
            localStorage.setItem('local_todos', JSON.stringify(todosData.data));
            setApiConnected(true);
          } else {
            throw new Error(todosData.message);
          }

          const infoRes = await fetch(`${urlToUse}?action=getInfos`);
          const infoData = await infoRes.json();
          if (infoData.status === 'success') {
            setInfos(infoData.data);
            localStorage.setItem('local_infos', JSON.stringify(infoData.data));
          }

          const usersRes = await fetch(`${urlToUse}?action=getUsers`);
          const usersData = await usersRes.json();
          if (usersData.status === 'success') {
            setUsers(usersData.data);
            localStorage.setItem('local_users', JSON.stringify(usersData.data));
          }
        } catch (error) {
          console.warn('Sync failed, using offline cache.', error);
          const localT = localStorage.getItem('local_todos');
          const localI = localStorage.getItem('local_infos');
          const localU = localStorage.getItem('local_users');
          setTodos(localT ? JSON.parse(localT) : fallbackTodos);
          setInfos(localI ? JSON.parse(localI) : fallbackInfos);
          if (localU) setUsers(JSON.parse(localU));
          setApiConnected(false);
        } finally {
          setSyncing(false);
        }
      };

      useEffect(() => {
        if (apiUrl && apiUrl !== defaultGasUrl) {
          localStorage.setItem('gas_api_url', apiUrl);
        }
        syncWithCloud();
        loadQuranSurahs();
      }, [apiUrl]);

      const loadQuranSurahs = async () => {
        setLoadingQuran(true);
        try {
          const res = await fetch('https://api.alquran.cloud/v1/surah');
          const data = await res.json();
          if (data.code === 200) {
            setQuranSurahs(data.data);
          }
        } catch (err) {
          console.error("Gagal memuat daftar Al-Quran", err);
          showToast("Gagal memuat daftar Al-Quran", "error");
        } finally {
          setLoadingQuran(false);
        }
      };

      const viewSurahDetails = async (surahNumber, qariId = selectedQari) => {
        setLoadingQuran(true);
        isPlayingFullSurahRef.current = false;
        isPlayingRangeRef.current = false;
        setIsPlayingFullSurah(false);
        setIsPlayingRange(false);
        setStartAyah('');
        setEndAyah('');
        try {
          const resAr = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,id.indonesian,${qariId}`);
          const data = await resAr.json();
          if (data.code === 200) {
            setSurahDetails({
              info: data.data[0],
              verses: data.data[0].ayahs.map((ayah, index) => ({
                number: ayah.numberInSurah,
                text: ayah.text,
                translation: data.data[1].ayahs[index].text,
                audio: data.data[2].ayahs[index].audio
              }))
            });
            setSelectedSurah(surahNumber);
          }
        } catch (err) {
          console.error("Gagal memuat detail surat", err);
          showToast("Gagal memuat ayat Al-Quran dengan Qari ini.", "error");
        } finally {
          setLoadingQuran(false);
        }
      };

      const handlePlayAudio = (audioUrl, verseId) => {
        isPlayingFullSurahRef.current = false;
        isPlayingRangeRef.current = false;
        setIsPlayingFullSurah(false);
        setIsPlayingRange(false);
        if (playingAudio && playingAudio.id === verseId) {
          if (audioRef.current) {
            audioRef.current.pause();
          }
          setPlayingAudio(null);
        } else {
          if (audioRef.current) {
            audioRef.current.pause();
          }
          audioRef.current = new Audio(audioUrl);
          audioRef.current.play().catch(e => console.log("Playback error: ", e));
          setPlayingAudio({ url: audioUrl, id: verseId });
          audioRef.current.onended = () => setPlayingAudio(null);
        }
      };

      // Play full surah endlessly with automatic repeat mode (infinite loop)
      const handlePlayFullSurah = () => {
        if (!surahDetails || surahDetails.verses.length === 0) return;
        if (isPlayingFullSurahRef.current) {
          if (audioRef.current) {
            audioRef.current.pause();
          }
          isPlayingFullSurahRef.current = false;
          setIsPlayingFullSurah(false);
          setPlayingAudio(null);
        } else {
          isPlayingFullSurahRef.current = true;
          isPlayingRangeRef.current = false;
          setIsPlayingFullSurah(true);
          setIsPlayingRange(false);
          playSurahVerse(0);
        }
      };

      const playSurahVerse = (index) => {
        if (!isPlayingFullSurahRef.current) return;
        if (index >= surahDetails.verses.length) {
          // Loop back to the first verse (index 0) endlessly (infinite repeat mode)
          playSurahVerse(0);
          return;
        }
        
        const verse = surahDetails.verses[index];
        setCurrentFullSurahIndex(index);
        
        if (audioRef.current) {
          audioRef.current.pause();
        }
        
        audioRef.current = new Audio(verse.audio);
        audioRef.current.play().catch(e => console.log("Playback error: ", e));
        setPlayingAudio({ url: verse.audio, id: verse.number });
        audioRef.current.onended = () => {
          playSurahVerse(index + 1);
        };
      };

      // Play specific range of verses endlessly with repeat mode (infinite loop)
      const playSurahVerseRange = (currIndex, endIndex) => {
        if (!isPlayingRangeRef.current) return;
        const startVal = parseInt(startAyah, 10) || 1;
        const endVal = parseInt(endAyah, 10) || surahDetails.info.numberOfAyahs;

        if (currIndex > endIndex || currIndex >= surahDetails.verses.length) {
          // Loop back to the start of the range endlessly (infinite repeat mode)
          playSurahVerseRange(startVal - 1, endVal - 1);
          return;
        }

        const verse = surahDetails.verses[currIndex];
        setCurrentFullSurahIndex(currIndex);

        if (audioRef.current) {
          audioRef.current.pause();
        }

        audioRef.current = new Audio(verse.audio);
        audioRef.current.play().catch(e => console.log("Playback error: ", e));
        setPlayingAudio({ url: verse.audio, id: verse.number });
        audioRef.current.onended = () => {
          playSurahVerseRange(currIndex + 1, endIndex);
        };
      };

      const handleQuranPlayback = () => {
        if (!surahDetails || surahDetails.verses.length === 0) return;

        if (quranPlayMode === 'full') {
          handlePlayFullSurah();
        } else if (quranPlayMode === 'range') {
          if (isPlayingRangeRef.current) {
            if (audioRef.current) {
              audioRef.current.pause();
            }
            isPlayingRangeRef.current = false;
            setIsPlayingRange(false);
            setPlayingAudio(null);
          } else {
            const startVal = parseInt(startAyah, 10);
            const endVal = parseInt(endAyah, 10) || surahDetails.info.numberOfAyahs;
            
            if (isNaN(startVal) || startVal < 1 || startVal > surahDetails.info.numberOfAyahs) {
              showToast(`Nomor ayat awal tidak valid! (1 s/d ${surahDetails.info.numberOfAyahs})`, 'error');
              return;
            }
            if (isNaN(endVal) || endVal < startVal || endVal > surahDetails.info.numberOfAyahs) {
              showToast(`Nomor ayat akhir tidak valid! (${startVal} s/d ${surahDetails.info.numberOfAyahs})`, 'error');
              return;
            }

            isPlayingRangeRef.current = true;
            isPlayingFullSurahRef.current = false;
            setIsPlayingRange(true);
            setIsPlayingFullSurah(false);
            playSurahVerseRange(startVal - 1, endVal - 1);
          }
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        if (!regForm.username || !regForm.email || !regForm.password) {
          setAuthError('Mohon isi semua field registrasi!');
          return;
        }

        if (regForm.password.length < 3) {
          setAuthError('Password minimal harus memiliki panjang 3 karakter!');
          return;
        }

        const usernameLower = regForm.username.toLowerCase().trim();
        const emailLower = regForm.email.toLowerCase().trim();

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'registerUser',
                username: usernameLower,
                email: emailLower,
                password: regForm.password
              })
            });
            const data = await response.json();
            if (data.status === 'success') {
              setAuthSuccess('Registrasi berhasil! Silakan masuk menggunakan kredensial Anda.');
              setLoginForm({ username: usernameLower, password: regForm.password });
              setIsRegisterMode(false);
            } else {
              setAuthError(data.message || 'Registrasi gagal.');
            }
          } catch (err) {
            setAuthError('Gagal terhubung ke cloud backend.');
          } finally {
            setSyncing(false);
          }
        } else {
          const currentLocalUsers = JSON.parse(localStorage.getItem('local_users') || '[]');
          const exists = currentLocalUsers.some(u => u.username.toLowerCase() === usernameLower || u.email.toLowerCase() === emailLower);
          
          if (exists) {
            setAuthError('Username atau Email sudah terdaftar sebelumnya!');
            return;
          }

          const newUser = {
            username: usernameLower,
            email: emailLower,
            password: regForm.password,
            role: currentLocalUsers.length === 0 ? 'admin' : 'user'
          };

          const updatedUsers = [...currentLocalUsers, newUser];
          localStorage.setItem('local_users', JSON.stringify(updatedUsers));
          setUsers(updatedUsers);
          setAuthSuccess(`Registrasi berhasil! Masuk menggunakan akun Anda.`);
          setLoginForm({ username: usernameLower, password: regForm.password });
          setIsRegisterMode(false);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        
        if (!loginForm.username || !loginForm.password) {
          setAuthError('Mohon isi username dan password!');
          return;
        }

        if (loginForm.password.length < 3) {
          setAuthError('Password minimal harus memiliki panjang 3 karakter!');
          return;
        }

        const queryStr = loginForm.username.toLowerCase().trim();

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(`${apiUrl}?action=getUsers`);
            const data = await res.json();
            if (data.status === 'success') {
              const matchedUser = data.data.find(u => 
                (u.username.toString().toLowerCase().trim() === queryStr || u.email.toString().toLowerCase().trim() === queryStr) && 
                u.password.toString() === loginForm.password.toString()
              );

              if (matchedUser) {
                const userSession = {
                  username: matchedUser.username,
                  email: matchedUser.email,
                  role: matchedUser.role || 'user'
                };
                setCurrentUser(userSession);
                localStorage.setItem('active_user', JSON.stringify(userSession));
                syncWithCloud();
              } else {
                setAuthError('Username atau password salah / Akun belum disetujui admin.');
              }

            username: matched.username,
            email: matched.email,
            role: matched.role

          setCurrentUser(userSession);

                  <i className="fa-solid fa-circle-xmark text-xl"></i>
                </button>

                <h3 className="text-base font-bold text-islamic-dark dark:text-stone-100 mb-4 flex items-center">
                  <i className="fa-solid fa-file-signature text-emerald-600 mr-2"></i> Detail & Keterangan Aktifitas
                </h3>

                <div className="mb-4 p-3 bg-stone-50 dark:bg-stone-800 rounded-xl border border-stone-100 dark:border-stone-700">
                  <div className="font-bold text-sm text-stone-800 dark:text-stone-100">{keteranganModal.todo.task}</div>
                  <div className="text-xs text-stone-500 mt-1">{keteranganModal.todo.subActivity}</div>
                </div>

                {currentUser.role === 'admin' ? (
                  <form onSubmit={submitKeterangan} className="space-y-4 text-xs text-left">
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-stone-400 mb-1">Keterangan (Max 100 Karakter)</label>
                      <textarea 
                        required
                        maxLength={100}
                        rows={3}
                        className="w-full px-3 py-2 rounded-xl border border-stone-100 dark:border-stone-800 bg-stone-50 dark:bg-stone-800 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500 text-slate-800 dark:text-stone-100"
                        placeholder="Masukkan keterangan pencapaian..."
                        value={keteranganModal.text}
                        onChange={(e) => setKeteranganModal({ ...keteranganModal, text: e.target.value })}
                      />
                      <span className="text-[9px] text-stone-400 block mt-0.5 text-right">{keteranganModal.text.length}/100 karakter</span>
                    </div>

                    <button 
                      type="submit" 
                      className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-islamic-mint text-white font-bold transition-all shadow-lg"
                    >
                      <i className="fa-solid fa-save mr-1"></i> Simpan Keterangan
                    </button>
                  </form>
                ) : (
                  <div className="space-y-2 text-xs">
                    <label className="block text-[10px] font-bold uppercase text-stone-400">Keterangan Pencapaian:</label>
                    <div className="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-200 border border-emerald-100 dark:border-emerald-800/50 italic">
                      {keteranganModal.todo.keterangan ? keteranganModal.todo.keterangan : "Belum ada keterangan pencapaian kerja."}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer className="fixed bottom-0 left-0 right-0 py-2.5 bg-islamic-dark text-slate-300 text-center text-[10px] tracking-widest font-semibold border-t border-emerald-950/40 z-20 shadow-lg">
            CREATED BY RAFLIANO
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
