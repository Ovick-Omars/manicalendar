  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

      background: rgba(11, 43, 38, 0.85);

      border: 1px solid rgba(255, 255, 255, 0.05);

<body class="bg-[#F4F7F6] text-slate-800 dark:bg-stone-950 dark:text-stone-100 min-h-screen flex flex-col transition-colors duration-300 pb-20">

  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- Interactive React Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Configuration & Base States (URL set to default or saved)
      const defaultGasUrl = 'https://script.google.com/macros/s/AKfycbyRD0YiKM7DeN6cNaF73A3C3BIB9r-jJLq3rOK0pdC4RMsyJSgtn7CKPEpyr8vTRp_kkQ/exec';
      const [apiConnected, setApiConnected] = useState(false);
      const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('gas_api_url') || defaultGasUrl);
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('active_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [currentTab, setCurrentTab] = useState('home'); // home | calendar | quran | info | settings
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
      
      // Data States
      const [users, setUsers] = useState([]);
      const [todos, setTodos] = useState([]);
      const [infos, setInfos] = useState([]);
      const [syncing, setSyncing] = useState(false);
      
      // Pagination State for Todos (10 rows per page)
      const [currentPage, setCurrentPage] = useState(1);
      const rowsPerPage = 10;

      // Authentication States
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [regForm, setRegForm] = useState({ username: '', email: '', password: '' });
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');
      
      // Database Config Panel on Login Screen
      const [showLoginDbConfig, setShowLoginDbConfig] = useState(false);
      const [tempApiUrl, setTempApiUrl] = useState(apiUrl);

      // Task/Activity Modal Form State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedDate, setSelectedDate] = useState(null);
      const [activityForm, setActivityForm] = useState({
        id: '',
        task: '',
        subActivity: '',
        pic: '',
        startDate: '',
        endDate: '',
        progress: 0,
        keterangan: '',
        createdBy: ''
      });
      const [isEditing, setIsEditing] = useState(false);

      // Info Form Modal State
      const [isInfoModalOpen, setIsInfoModalOpen] = useState(false);
      const [infoForm, setInfoForm] = useState({
        title: '',
        content: ''
      });

      // Keterangan Modal State
      const [keteranganModal, setKeteranganModal] = useState({ isOpen: false, todo: null, text: '' });

      // Quran Component States
      const [quranSurahs, setQuranSurahs] = useState([]);
      const [selectedSurah, setSelectedSurah] = useState(null);
      const [surahDetails, setSurahDetails] = useState(null);
      const [loadingQuran, setLoadingQuran] = useState(false);
      const [playingAudio, setPlayingAudio] = useState(null); // { url, id }
      const [quranSearch, setQuranSearch] = useState('');
      const [isPlayingFullSurah, setIsPlayingFullSurah] = useState(false);
      const [currentFullSurahIndex, setCurrentFullSurahIndex] = useState(0);
      
      const audioRef = useRef(null);

      // Static Backup/Demo Data (When API not configured or offline)
      const fallbackTodos = [
        { id: '1', task: 'Ujian Tengah Semester Ganjil', subActivity: 'Persiapan lembar soal & pengawas madrasah', pic: 'Ust. Ahmad', startDate: '2026-06-01', endDate: '2026-06-05', progress: 50, createdBy: 'admin', keterangan: 'Soal sedang dicetak.' },
        { id: '2', task: 'Rapat Kerja Tahunan Madrasah', subActivity: 'Penyusunan anggaran belanja sekolah', pic: 'Bu Aminah', startDate: '2026-06-10', endDate: '2026-06-12', progress: 100, createdBy: 'admin', keterangan: 'Rapat berjalan lancar.' },
        { id: '3', task: 'Penerimaan Santri Baru (PSB)', subActivity: 'Seleksi berkas & wawancara online', pic: 'Ust. Zulkifli', startDate: '2026-06-15', endDate: '2026-06-20', progress: 20, createdBy: 'admin', keterangan: '' }
      ];

      const fallbackInfos = [
        { id: '1', title: 'Persiapan Ujian Semester', content: 'Diharapkan seluruh asatidzah mempersiapkan naskah soal ujian paling lambat akhir minggu ini.', timestamp: '01-06-2026 09:15', createdBy: 'rafliano' },
        { id: '2', title: 'Kebersihan Lingkungan Madrasah', content: 'Kerja bakti rutin hari Jumat akan difokuskan pada area halaman depan dan ruang kelas baru.', timestamp: '01-06-2026 10:30', createdBy: 'admin' }
      ];

      // Theme toggle handler
      useEffect(() => {
        const rootClass = document.documentElement.classList;
        if (theme === 'dark') {
          rootClass.add('dark');
        } else {
          rootClass.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      // Formatter function to format YYYY-MM-DD or ISO to dd-mm-yyyy
      const formatDateStr = (dateStr) => {
        if (!dateStr) return '';
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) {
            // Check if string contains dash
            if (dateStr.includes('-')) {
              const parts = dateStr.split('-');
              if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
              }
            }
            return dateStr;
          }
          const day = String(d.getDate()).padStart(2, '0');
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const year = d.getFullYear();
          return `${day}-${month}-${year}`;
        } catch (e) {
          return dateStr;
        }
      };

      // Handle Data Synchronization with Google Sheets API
      const syncWithCloud = async (urlToUse = apiUrl) => {
        if (!urlToUse || urlToUse === defaultGasUrl) {
          // Fallbacks
          setTodos(JSON.parse(localStorage.getItem('local_todos')) || fallbackTodos);
          setInfos(JSON.parse(localStorage.getItem('local_infos')) || fallbackInfos);
          setApiConnected(false);
          return;
        }

        setSyncing(true);
        try {
          // Fetch Todos
          const todosRes = await fetch(`${urlToUse}?action=getTodos`);
          const todosData = await todosRes.json();
          if (todosData.status === 'success') {
            setTodos(todosData.data);
            localStorage.setItem('local_todos', JSON.stringify(todosData.data));
            setApiConnected(true);
          } else {
            throw new Error(todosData.message);
          }

          // Fetch Infos
          const infoRes = await fetch(`${urlToUse}?action=getInfos`);
          const infoData = await infoRes.json();
          if (infoData.status === 'success') {
            setInfos(infoData.data);
            localStorage.setItem('local_infos', JSON.stringify(infoData.data));
          }
        } catch (error) {
          console.warn('Sync failed, using offline cache.', error);
          setTodos(JSON.parse(localStorage.getItem('local_todos')) || fallbackTodos);
          setInfos(JSON.parse(localStorage.getItem('local_infos')) || fallbackInfos);
          setApiConnected(false);
        } finally {
          setSyncing(false);
        }
      };

      // Periodic Auto-Sync and Initial Sync
      useEffect(() => {
        if (apiUrl) {
          localStorage.setItem('gas_api_url', apiUrl);
        }
        syncWithCloud();
        loadQuranSurahs();
      }, [apiUrl]);

      // Initialize default users if not set
      useEffect(() => {
        const localUsers = localStorage.getItem('local_users');
        if (!localUsers) {
          const defaultUsers = [
            { username: 'admin', email: 'admin@manicalendar.com', password: '123', role: 'admin' },
            { username: 'rafliano', email: 'rafliano@school.id', password: '123', role: 'admin' },
            { username: 'guru1', email: 'guru@school.id', password: '123', role: 'user' }
          ];
          localStorage.setItem('local_users', JSON.stringify(defaultUsers));
          setUsers(defaultUsers);
        } else {
          setUsers(JSON.parse(localUsers));
        }
      }, []);

      // Load Quran Surahs
      const loadQuranSurahs = async () => {
        setLoadingQuran(true);
        try {
          const res = await fetch('https://api.alquran.cloud/v1/surah');
          const data = await res.json();
          if (data.code === 200) {
            setQuranSurahs(data.data);
          }
        } catch (err) {
          console.error("Gagal memuat surat Al-Quran", err);
        } finally {
          setLoadingQuran(false);
        }
      };

      // Load Surah Details with Indonesian translation
      const viewSurahDetails = async (surahNumber) => {
        setLoadingQuran(true);
        setIsPlayingFullSurah(false);
        try {
          const resAr = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,id.indonesian,ar.alafasy`);
          const data = await resAr.json();
          if (data.code === 200) {
            setSurahDetails({
              info: data.data[0],
              verses: data.data[0].ayahs.map((ayah, index) => ({
                number: ayah.numberInSurah,
                text: ayah.text,
                translation: data.data[1].ayahs[index].text,
                audio: data.data[2].ayahs[index].audio
              }))
            });
            setSelectedSurah(surahNumber);
          }
        } catch (err) {
          console.error("Gagal memuat detail surat", err);
        } finally {
          setLoadingQuran(false);
        }
      };

      // Play Quranic audio recitation per verse
      const handlePlayAudio = (audioUrl, verseId) => {
        setIsPlayingFullSurah(false);
        if (playingAudio && playingAudio.id === verseId) {
          audioRef.current.pause();
          setPlayingAudio(null);
        } else {
          if (audioRef.current) {
            audioRef.current.pause();
          }
          audioRef.current = new Audio(audioUrl);
          audioRef.current.play();
          setPlayingAudio({ url: audioUrl, id: verseId });
          audioRef.current.onended = () => setPlayingAudio(null);
        }
      };

      // Play continuous full surah audios sequentially
      const handlePlayFullSurah = () => {
        if (!surahDetails || surahDetails.verses.length === 0) return;
        
        if (isPlayingFullSurah) {
          audioRef.current.pause();
          setIsPlayingFullSurah(false);
          setPlayingAudio(null);
        } else {
          setIsPlayingFullSurah(true);
          playSurahVerse(0);
        }
      };

      const playSurahVerse = (index) => {
        if (index >= surahDetails.verses.length) {
          setIsPlayingFullSurah(false);
          setPlayingAudio(null);
          return;
        }
        
        const verse = surahDetails.verses[index];
        setCurrentFullSurahIndex(index);
        
        if (audioRef.current) {
          audioRef.current.pause();
        }
        
        audioRef.current = new Audio(verse.audio);
        audioRef.current.play();
        setPlayingAudio({ url: verse.audio, id: verse.number });
        
        audioRef.current.onended = () => {
          playSurahVerse(index + 1);
        };
      };

      // Registration Handler
      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        if (!regForm.username || !regForm.email || !regForm.password) {
          setAuthError('Mohon isi semua field registrasi!');
          return;
        }

        const usernameLower = regForm.username.toLowerCase();
        const emailLower = regForm.email.toLowerCase();

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'registerUser',
                username: usernameLower,
                email: emailLower,
                password: regForm.password
              })
            });
            const data = await response.json();
            if (data.status === 'success') {
              setAuthSuccess('Registrasi berhasil! Silakan masuk menggunakan kredensial Anda agar tersinkronisasi.');
              
              // Automatically switch to login screen so they can login freshly
              setLoginForm({ username: usernameLower, password: regForm.password });
              setIsRegisterMode(false);
            } else {
              setAuthError(data.message || 'Registrasi gagal.');
            }
          } catch (err) {
            setAuthError('Gagal terhubung ke cloud backend.');
          } finally {
            setSyncing(false);
          }
        } else {
          // Offline mode registration
          const currentLocalUsers = JSON.parse(localStorage.getItem('local_users') || '[]');
          const exists = currentLocalUsers.some(u => u.username.toLowerCase() === usernameLower || u.email.toLowerCase() === emailLower);
          
          if (exists) {
            setAuthError('Username atau Email sudah terdaftar sebelumnya!');
            return;
          }

          const newUser = {
            username: usernameLower,
            email: emailLower,
            password: regForm.password,
            role: currentLocalUsers.length === 0 ? 'admin' : 'user'
          };

          const updatedUsers = [...currentLocalUsers, newUser];
          localStorage.setItem('local_users', JSON.stringify(updatedUsers));
          setUsers(updatedUsers);
          setAuthSuccess(`Registrasi berhasil! Masuk menggunakan akun Anda.`);
          setLoginForm({ username: usernameLower, password: regForm.password });
          setIsRegisterMode(false);
        }
      };

      // Login Handler
      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        
        if (!loginForm.username || !loginForm.password) {
          setAuthError('Mohon isi username dan password!');
          return;
        }

        const queryStr = loginForm.username.toLowerCase();

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(`${apiUrl}?action=getUsers`);
            const data = await res.json();
            if (data.status === 'success') {
              const matchedUser = data.data.find(u => 
                (u.username.toLowerCase() === queryStr || u.email.toLowerCase() === queryStr) && 
                u.password.toString() === loginForm.password.toString()
              );

              if (matchedUser) {
                const userSession = {
                  username: matchedUser.username,
                  email: matchedUser.email,
                  role: matchedUser.role || 'user'
                };
                setCurrentUser(userSession);
                localStorage.setItem('active_user', JSON.stringify(userSession));
                syncWithCloud();
              } else {
                setAuthError('Username atau password salah / Akun belum disetujui admin.');
              }
            } else {
              setAuthError('Error memverifikasi kredensial.');
            }
          } catch (err) {
            setAuthError('Backend Cloud tidak merespon. Mencoba login offline lokal...');
            attemptLocalLogin(queryStr);
          } finally {
            setSyncing(false);
          }
        } else {
          attemptLocalLogin(queryStr);
        }
      };

      const attemptLocalLogin = (queryStr) => {
        const currentLocalUsers = JSON.parse(localStorage.getItem('local_users') || '[]');
        const matched = currentLocalUsers.find(u => 
          (u.username.toLowerCase() === queryStr || u.email.toLowerCase() === queryStr) && 
          u.password.toString() === loginForm.password.toString()
        );

        if (matched) {
          const userSession = {
            username: matched.username,
            email: matched.email,
            role: matched.role
          };
          setCurrentUser(userSession);
          localStorage.setItem('active_user', JSON.stringify(userSession));
          syncWithCloud();
        } else {
          setAuthError('Username atau password salah.');
        }
      };

      // Logout Handler
      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('active_user');
        if (audioRef.current) {
          audioRef.current.pause();
        }
        setPlayingAudio(null);
        setIsPlayingFullSurah(false);
      };

      // Save/Edit Activity
      const handleSaveActivity = async (e) => {
        e.preventDefault();
        if (currentUser.role !== 'admin') {
          alert('Hanya Administrator yang dapat memanipulasi rencana kerja!');
          return;
        }

        const payload = {
          action: 'saveTodo',
          id: activityForm.id || Date.now().toString(),
          task: activityForm.task,
          subActivity: activityForm.subActivity,
          pic: activityForm.pic,
          startDate: activityForm.startDate || new Date().toISOString().split('T')[0],
          endDate: activityForm.endDate,
          progress: Number(activityForm.progress),
          keterangan: activityForm.keterangan || '',
          createdBy: currentUser.username
        };

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === 'success') {
              setIsModalOpen(false);
              syncWithCloud();
            } else {
              alert('Gagal menyimpan aktivitas: ' + data.message);
            }
          } catch (err) {
            alert('Koneksi Cloud gagal. Disimpan ke penyimpanan lokal.');
            saveActivityLocally(payload);
          } finally {
            setSyncing(false);
          }
        } else {
          saveActivityLocally(payload);
        }
      };

      const saveActivityLocally = (payload) => {
        const localList = JSON.parse(localStorage.getItem('local_todos') || JSON.stringify(fallbackTodos));
        let updatedList;
        const existsIdx = localList.findIndex(t => t.id.toString() === payload.id.toString());
        if (existsIdx !== -1) {
          updatedList = [...localList];
          updatedList[existsIdx] = payload;
        } else {
          updatedList = [payload, ...localList];
        }
        setTodos(updatedList);
        localStorage.setItem('local_todos', JSON.stringify(updatedList));
        setIsModalOpen(false);
      };

      // Save Info Pengumuman
      const handleSaveInfo = async (e) => {
        e.preventDefault();
        if (currentUser.role !== 'admin') {
          alert('Hanya Administrator yang dapat menambahkan pengumuman informasi!');
          return;
        }

        // Generate current timestamp on Indonesian format (dd-mm-yyyy HH:MM)
        const now = new Date();
        const dateStr = formatDateStr(now.toISOString().split('T')[0]);
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const timestamp = `${dateStr} ${timeStr}`;

        const payload = {
          action: 'saveInfo',
          id: Date.now().toString(),
          title: infoForm.title,
          content: infoForm.content,
          timestamp: timestamp,
          createdBy: currentUser.username
        };

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === 'success') {
              setIsInfoModalOpen(false);
              setInfoForm({ title: '', content: '' });
              syncWithCloud();
            } else {
              alert('Gagal menyimpan informasi: ' + data.message);
            }
          } catch (err) {
            alert('Koneksi Cloud bermasalah. Disimpan secara lokal.');
            saveInfoLocally(payload);
          } finally {
            setSyncing(false);
          }
        } else {
          saveInfoLocally(payload);
        }
      };

      const saveInfoLocally = (payload) => {
        const localList = JSON.parse(localStorage.getItem('local_infos') || JSON.stringify(fallbackInfos));
        const updatedList = [payload, ...localList];
        setInfos(updatedList);
        localStorage.setItem('local_infos', JSON.stringify(updatedList));
        setIsInfoModalOpen(false);
        setInfoForm({ title: '', content: '' });
      };

      // Delete Activity
      const handleDeleteActivity = async (activityId) => {
        if (!confirm('Apakah Anda yakin ingin menghapus rencana kerja ini?')) return;

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'deleteTodo', id: activityId })
            });
            const data = await res.json();
            if (data.status === 'success') {
              syncWithCloud();
            } else {
              alert('Gagal menghapus dari Spreadsheet: ' + data.message);
            }
          } catch (err) {
            deleteActivityLocally(activityId);
          } finally {
            setSyncing(false);
          }
        } else {
          deleteActivityLocally(activityId);
        }
      };

      const deleteActivityLocally = (activityId) => {
        const localList = JSON.parse(localStorage.getItem('local_todos') || '[]');
        const updatedList = localList.filter(t => t.id.toString() !== activityId.toString());
        setTodos(updatedList);
        localStorage.setItem('local_todos', JSON.stringify(updatedList));
      };

      // Delete Info
      const handleDeleteInfo = async (infoId) => {
        if (!confirm('Apakah Anda yakin ingin menghapus informasi ini?')) return;

        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'deleteInfo', id: infoId })
            });
            const data = await res.json();
            if (data.status === 'success') {
              syncWithCloud();
            } else {
              alert('Gagal menghapus dari cloud: ' + data.message);
            }
          } catch (err) {
            deleteInfoLocally(infoId);
          } finally {
            setSyncing(false);
          }
        } else {
          deleteInfoLocally(infoId);
        }
      };

      const deleteInfoLocally = (infoId) => {
        const localList = JSON.parse(localStorage.getItem('local_infos') || '[]');
        const updatedList = localList.filter(i => i.id.toString() !== infoId.toString());
        setInfos(updatedList);
        localStorage.setItem('local_infos', JSON.stringify(updatedList));
      };

      // Fast Progress to 100%
      const handleMarkDone = async (activity) => {
        if (currentUser.role !== 'admin') return;
        const updatedActivity = { ...activity, progress: 100 };
        
        if (apiUrl && apiUrl !== defaultGasUrl) {
          setSyncing(true);
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'saveTodo',
                ...updatedActivity
              })
            });
            const data = await res.json();
            if (data.status === 'success') {
              syncWithCloud();
            }
          } catch (err) {
            saveActivityLocally(updatedActivity);
          } finally {
            setSyncing(false);
          }
        } else {
          saveActivityLocally(updatedActivity);
        }
      };

      // Open creation modal for a specific calendar date clicked
      const handleDateClick = (dateStr) => {

          task: '',
          subActivity: '',
          pic: '',
          startDate: dateStr,
          endDate: dateStr,

          keterangan: '',

          ...keteranganModal.todo, 
          keterangan: keteranganModal.text

          setSyncing(true);
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'saveTodo',
                ...updatedActivity
              })

            const data = await res.json();

              setKeteranganModal({ isOpen: false, todo: null, text: '' });

            saveActivityLocally(updatedActivity);
            setKeteranganModal({ isOpen: false, todo: null, text: '' });

            setSyncing(false);

      // Save database setting URL
      const saveSettings = (e) => {

                        <i class="fa-solid fa-database mr-1"></i> Set Database

                  <i class="fa-solid fa-calendar-alt text-base block mb-1 text-center"></i> Kalender

                <button

                <button

                  <i class="fa-brands fa-youtube text-base block mb-1 text-center"></i> Live Madinah

                <button

                        placeholder="Masukkan keterangan pencapaian..."
                        value={keteranganModal.text}
                        onChange={(e) => setKeteranganModal({ ...keteranganModal, text: e.target.value })}
                      />
                      <span class="text-[9px] text-stone-400 block mt-0.5 text-right">{keteranganModal.text.length}/100 karakter</span>
                    </div>

                    <button 
                      type="submit" 
                      class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-islamic-mint text-white font-bold transition-all"
                    >
                      <i class="fa-solid fa-save mr-1"></i> Simpan Keterangan
                    </button>
                  </form>
                ) : (
                  <div class="space-y-2 text-xs">
                    <label class="block text-[10px] font-bold uppercase text-stone-400">Keterangan Pencapaian:</label>
                    <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-200 border border-emerald-100 dark:border-emerald-800/50 italic">
                      {keteranganModal.todo.keterangan ? keteranganModal.todo.keterangan : "Belum ada keterangan pencapaian kerja."}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Premium Elegant Watermark Footer */}
          <footer class="fixed bottom-0 left-0 right-0 py-2.5 bg-islamic-dark text-slate-300 text-center text-[10px] tracking-widest font-semibold border-t border-emerald-950/40 z-20 shadow-lg">
            CREATED BY RAFLIANO
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
