// LocalStorage helpers
var ls = {

function parseLocalDate(s){
  if(!s) return null;
  try{
    s=s.toString().trim();
    var p=s.includes('T')?s.split('T')[0]:s;
    var pts=p.split(/[-/]/);
    if(pts.length===3){
      if(pts[0].length===4) return new Date(+pts[0],+pts[1]-1,+pts[2]);
      if(pts[2].length===4) return new Date(+pts[2],+pts[1]-1,+pts[0]);
    }
    var d=new Date(s); if(!isNaN(d)) return d;
  }catch(e){}
  return null;
}
function formatDateStr(s){
  var d=parseLocalDate(s); if(!d) return s||'';
  return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
}
function toInputDate(s){
  var d=parseLocalDate(s); if(!d) return s||'';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatTimestamp(ts){
  if(!ts) return '';
  var d=new Date(ts.toString().trim()); if(isNaN(d)) return ts;
  return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function getHijri(){

}

// ─────────────────────────────────────────────────────────────────
// KOMPONEN REACT — menggunakan React.createElement langsung (TANPA BABEL, TANPA JSX)

var e = React.createElement;
var useState    = React.useState;
var useEffect   = React.useEffect;
var useRef      = React.useRef;
var useCallback = React.useCallback;

// ── Komponen kecil ──
function Icon(props){ return e('i',{className:'fa-solid '+props.cls+(props.extra?' '+props.extra:'')}); }

function Toast(props){
  if(!props.show) return null;
  var colors = props.type==='success'?'bg-emerald-600 border-emerald-500':props.type==='error'?'bg-rose-600 border-rose-500':'bg-amber-500 border-amber-400';
  var icon   = props.type==='success'?'fa-circle-check':props.type==='error'?'fa-triangle-exclamation':'fa-circle-exclamation';
  return e('div',{className:'fixed top-20 right-4 z-50 animate-bounce'},
    e('div',{className:'px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-white border '+colors},
      e('i',{className:'fa-solid '+icon}),
      e('span',{className:'text-xs font-bold'},props.message)
    )
  );
}

function ConfirmModal(props){
  if(!props.isOpen) return null;
  return e('div',{className:'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm'},
    e('div',{className:'w-full max-w-sm bg-white dark:bg-stone-900 rounded-3xl p-6 border border-stone-100 dark:border-stone-800 shadow-2xl text-center'},
      e('div',{className:'w-12 h-12 rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center mx-auto mb-3'},
        e('i',{className:'fa-solid fa-circle-question text-xl'})
      ),
      e('h3',{className:'text-sm font-bold text-slate-800 dark:text-stone-100 mb-2'},'Konfirmasi Tindakan'),
      e('p',{className:'text-xs text-stone-500 dark:text-stone-400 mb-6'},props.message),
      e('div',{className:'flex space-x-2'},
        e('button',{onClick:props.onCancel,className:'flex-1 py-2.5 rounded-xl border border-stone-200 dark:border-stone-700 text-xs font-bold text-stone-500'},'Batal'),
        e('button',{onClick:props.onConfirm,className:'flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold hover:bg-rose-700 shadow-md'},'Ya, Jalankan')
      )
    )
  );
}

// ── KOMPONEN UTAMA APP ──
function App(){
  var [apiUrl,setApiUrl]             = useState(function(){ return ls.str('gas_api_url',''); });
  var [apiConnected,setApiConnected] = useState(false);
  var [currentUser,setCurrentUser]   = useState(function(){ return ls.get('active_user',null); });
  var [currentTab,setCurrentTab]     = useState('home');
  var [theme,setTheme]               = useState(function(){ return ls.str('theme','light'); });
  var [users,setUsers]               = useState([]);
  var [todos,setTodos]               = useState([]);
  var [infos,setInfos]               = useState([]);
  var [syncing,setSyncing]           = useState(false);
  var [page,setPage]                 = useState(1);
  var rowsPerPage = 10;
  var [toast,setToast]               = useState({show:false,message:'',type:'success'});
  var [confirm,setConfirm]           = useState({isOpen:false,message:'',action:null});
  var [urlModal,setUrlModal]         = useState(false);
  var [urlInput,setUrlInput]         = useState('');
  var [showPw,setShowPw]             = useState(false);
  var [showRegPw,setShowRegPw]       = useState(false);
  var [regMode,setRegMode]           = useState(false);
  var [regForm,setRegForm]           = useState({username:'',email:'',password:''});
  var [loginForm,setLoginForm]       = useState({username:'',password:''});
  var [authErr,setAuthErr]           = useState('');
  var [authOk,setAuthOk]             = useState('');
  var [modalOpen,setModalOpen]       = useState(false);
  var [actForm,setActForm]           = useState({id:'',task:'',subActivity:'',pic:'',startDate:'',endDate:'',progress:0,keterangan:'',createdBy:''});
  var [isEditing,setIsEditing]       = useState(false);
  var [infoModal,setInfoModal]       = useState(false);
  var [editingInfo,setEditingInfo]   = useState(false);
  var [infoForm,setInfoForm]         = useState({id:'',title:'',content:''});
  var [ketModal,setKetModal]         = useState({isOpen:false,todo:null,text:''});
  var [surahs,setSurahs]             = useState([]);
  var [selSurah,setSelSurah]         = useState(null);
  var [surahDet,setSurahDet]         = useState(null);
  var [loadQ,setLoadQ]               = useState(false);
  var [playAud,setPlayAud]           = useState(null);
  var [qSearch,setQSearch]           = useState('');
  var [playFull,setPlayFull]         = useState(false);
  var [playIdx,setPlayIdx]           = useState(0);
  var [playMode,setPlayMode]         = useState('full');
  var [startAyah,setStartAyah]       = useState('');
  var [endAyah,setEndAyah]           = useState('');
  var [playRange,setPlayRange]       = useState(false);
  var [qari,setQari]                 = useState('ar.alafasy');
  var playFullRef  = useRef(false);
  var playRangeRef = useRef(false);
  var audRef       = useRef(null);

  // Theme effect
  useEffect(function(){
    document.documentElement.classList.toggle('dark', theme==='dark');
    ls.setStr('theme',theme);
  },[theme]);

  // Boot
  useEffect(function(){
    syncCloud(apiUrl);
    loadSurahs();
  },[]);

  function showToast(msg,type){
    setToast({show:true,message:msg,type:type||'success'});
    setTimeout(function(){ setToast(function(p){ return Object.assign({},p,{show:false}); }); },4000);
  }

  function askConfirm(msg,fn){
    setConfirm({isOpen:true,message:msg,action:fn});
  }

  // ── CLOUD SYNC ──
  function syncCloud(url){
    var u = url !== undefined ? url : apiUrl;
    if(!u){
      setTodos(ls.get('local_todos',FALLBACK_TODOS));
      setInfos(ls.get('local_infos',FALLBACK_INFOS));
      var lu=ls.get('local_users',null); if(lu) setUsers(lu);
      setApiConnected(false);
      return;
    }
    setSyncing(true);
    var ctrl = new AbortController();
    var tid  = setTimeout(function(){ ctrl.abort(); },10000);
    Promise.all([
      fetch(u+'?action=getTodos',{signal:ctrl.signal}).then(function(r){ return r.json(); }),
      fetch(u+'?action=getInfos',{signal:ctrl.signal}).then(function(r){ return r.json(); }),
      fetch(u+'?action=getUsers',{signal:ctrl.signal}).then(function(r){ return r.json(); })
    ]).then(function(results){
      clearTimeout(tid);
      var td=results[0], id=results[1], ud=results[2];
      if(td.status==='success'){ setTodos(td.data); ls.set('local_todos',td.data); setApiConnected(true); }
      if(id.status==='success'){ setInfos(id.data); ls.set('local_infos',id.data); }
      if(ud.status==='success'){ setUsers(ud.data); ls.set('local_users',ud.data); }
    }).catch(function(err){
      clearTimeout(tid);
      setTodos(ls.get('local_todos',FALLBACK_TODOS));
      setInfos(ls.get('local_infos',FALLBACK_INFOS));
      var lu=ls.get('local_users',null); if(lu) setUsers(lu);
      setApiConnected(false);
    }).finally(function(){ setSyncing(false); });
  }

  // ── QURAN ──
  function loadSurahs(){
    setLoadQ(true);
    fetch('https://api.alquran.cloud/v1/surah')
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d.code===200) setSurahs(d.data); })
      .catch(function(){ showToast('Gagal memuat daftar Al-Quran','error'); })
      .finally(function(){ setLoadQ(false); });
  }

  function viewSurah(num,q){
    var qId = q||qari;
    setLoadQ(true);
    playFullRef.current=false; playRangeRef.current=false;
    setPlayFull(false); setPlayRange(false); setStartAyah(''); setEndAyah('');
    fetch('https://api.alquran.cloud/v1/surah/'+num+'/editions/quran-uthmani,id.indonesian,'+qId)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.code===200){
          setSurahDet({
            info:d.data[0],
            verses:d.data[0].ayahs.map(function(a,i){
              return {number:a.numberInSurah,text:a.text,translation:d.data[1].ayahs[i].text,audio:d.data[2].ayahs[i].audio};
            })
          });
          setSelSurah(num);
        }
      })
      .catch(function(){ showToast('Gagal memuat ayat.','error'); })
      .finally(function(){ setLoadQ(false); });
  }

  function playAudio(url,id){
    playFullRef.current=false; playRangeRef.current=false;
    setPlayFull(false); setPlayRange(false);
    if(audRef.current) audRef.current.pause();
    if(playAud && playAud.id===id){ setPlayAud(null); return; }
    audRef.current=new Audio(url);
    audRef.current.play().catch(function(){});
    setPlayAud({url:url,id:id});
    audRef.current.onended=function(){ setPlayAud(null); };
  }

  function playVerseAt(idx){
    if(!playFullRef.current) return;
    if(idx>=surahDet.verses.length){ playVerseAt(0); return; }
    var v=surahDet.verses[idx];
    setPlayIdx(idx);
    if(audRef.current) audRef.current.pause();
    audRef.current=new Audio(v.audio);
    audRef.current.play().catch(function(){});
    setPlayAud({url:v.audio,id:v.number});
    audRef.current.onended=function(){ playVerseAt(idx+1); };
  }

  function playRangeAt(cur,end){
    if(!playRangeRef.current) return;
    var sv=parseInt(startAyah,10)||1;
    if(cur>end||cur>=surahDet.verses.length){ playRangeAt(sv-1,end); return; }
    var v=surahDet.verses[cur];
    setPlayIdx(cur);
    if(audRef.current) audRef.current.pause();
    audRef.current=new Audio(v.audio);
    audRef.current.play().catch(function(){});
    setPlayAud({url:v.audio,id:v.number});
    audRef.current.onended=function(){ playRangeAt(cur+1,end); };
  }

  function handleQuranPlayback(){
    if(!surahDet) return;
    if(playMode==='full'){
      if(playFullRef.current){
        if(audRef.current) audRef.current.pause();
        playFullRef.current=false; setPlayFull(false); setPlayAud(null);
      } else {
        playFullRef.current=true; playRangeRef.current=false;
        setPlayFull(true); setPlayRange(false);
        playVerseAt(0);
      }
    } else {
      if(playRangeRef.current){
        if(audRef.current) audRef.current.pause();
        playRangeRef.current=false; setPlayRange(false); setPlayAud(null);
      } else {
        var sv=parseInt(startAyah,10);
        var ev=parseInt(endAyah,10)||surahDet.info.numberOfAyahs;
        if(isNaN(sv)||sv<1||sv>surahDet.info.numberOfAyahs){ showToast('Nomor ayat awal tidak valid!','error'); return; }
        if(isNaN(ev)||ev<sv||ev>surahDet.info.numberOfAyahs){ showToast('Nomor ayat akhir tidak valid!','error'); return; }
        playRangeRef.current=true; playFullRef.current=false;
        setPlayRange(true); setPlayFull(false);
        playRangeAt(sv-1,ev-1);
      }
    }
  }

  // ── AUTH ──
  function handleRegister(ev){
    ev.preventDefault(); setAuthErr(''); setAuthOk('');
    if(regForm.password.length<3){ setAuthErr('Password minimal 3 karakter!'); return; }
    var uL=regForm.username.toLowerCase().trim(), eL=regForm.email.toLowerCase().trim();
    if(apiUrl){
      setSyncing(true);
      fetch(apiUrl,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'registerUser',username:uL,email:eL,password:regForm.password})})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.status==='success'){ setAuthOk('Registrasi berhasil! Silakan masuk.'); setLoginForm({username:uL,password:regForm.password}); setRegMode(false); }
          else setAuthErr(d.message||'Registrasi gagal.');
        })
        .catch(function(){ setAuthErr('Gagal terhubung ke cloud backend.'); })
        .finally(function(){ setSyncing(false); });
    } else {
      var cur=ls.get('local_users',[]);
      if(cur.some(function(u){ return u.username.toLowerCase()===uL||u.email.toLowerCase()===eL; })){ setAuthErr('Username atau Email sudah terdaftar!'); return; }
      var newU={username:uL,email:eL,password:regForm.password,role:cur.length===0?'admin':'user'};
      var upd=[].concat(cur,[newU]); ls.set('local_users',upd); setUsers(upd);
      setAuthOk('Registrasi berhasil!'); setLoginForm({username:uL,password:regForm.password}); setRegMode(false);
    }
  }

  function localLogin(q){
    var cur=ls.get('local_users',[]);
    var m=cur.find(function(u){ return (u.username.toLowerCase()===q||u.email.toLowerCase()===q)&&u.password.toString()===loginForm.password.toString(); });
    if(m){ var s={username:m.username,email:m.email,role:m.role}; setCurrentUser(s); ls.set('active_user',s); syncCloud(apiUrl); }
    else setAuthErr('Username atau password salah.');
  }

  function handleLogin(ev){
    ev.preventDefault(); setAuthErr('');
    if(!loginForm.username||!loginForm.password){ setAuthErr('Mohon isi username dan password!'); return; }
    var q=loginForm.username.toLowerCase().trim();
    if(apiUrl){
      setSyncing(true);
      fetch(apiUrl+'?action=getUsers')
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.status==='success'){
            var m=d.data.find(function(u){ return (u.username.toString().toLowerCase().trim()===q||u.email.toString().toLowerCase().trim()===q)&&u.password.toString()===loginForm.password.toString(); });
            if(m){ var s={username:m.username,email:m.email,role:m.role||'user'}; setCurrentUser(s); ls.set('active_user',s); syncCloud(apiUrl); }
            else setAuthErr('Username atau password salah / Akun belum disetujui admin.');
          } else setAuthErr('Error verifikasi kredensial.');
        })
        .catch(function(){ setAuthErr('Backend tidak merespon, mencoba login lokal...'); localLogin(q); })
        .finally(function(){ setSyncing(false); });
    } else { localLogin(q); }
  }

  function handleLogout(){
    setCurrentUser(null); ls.remove('active_user');
    playFullRef.current=false; playRangeRef.current=false;
    setPlayFull(false); setPlayRange(false);
    if(audRef.current) audRef.current.pause();
    setPlayAud(null);
  }

  // ── ACTIVITIES ──
  function postGas(payload,onOk,onFail){
    setSyncing(true);
    fetch(apiUrl,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d.status==='success') onOk(); else { showToast('Gagal: '+d.message,'error'); if(onFail) onFail(); } })
      .catch(function(){ if(onFail) onFail(); else showToast('Koneksi gagal.','error'); })
      .finally(function(){ setSyncing(false); });
  }

  function saveActLocally(pl){
    var list=ls.get('local_todos',FALLBACK_TODOS);
    var idx=list.findIndex(function(t){ return t.id.toString()===pl.id.toString(); });
    var upd=idx!==-1?list.map(function(t,i){ return i===idx?pl:t; }):[pl].concat(list);
    setTodos(upd); ls.set('local_todos',upd); setModalOpen(false); showToast('Tugas disimpan lokal!');
  }

  function handleSaveAct(ev){
